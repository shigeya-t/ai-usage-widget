name: AIUsageWidget
options:
  bundleIdPrefix: jp.shigeya
  deploymentTarget:
    macOS: "14.0"
  # Base.lproj を日本語として扱う。英語名は en.lproj の InfoPlist.strings で出す。
  developmentLanguage: ja
  knownRegions:
    - Base
    - en
    - ja
configFiles:
  Debug: Config/Team.xcconfig
  Release: Config/Team.xcconfig

targets:
  AIUsageWidget:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Shared
    dependencies:
      - target: AIUsageWidgetExtension
        embed: true
        codeSign: true
    scheme:
      testTargets:
        - AIUsageWidgetTests
    info:
      path: App/Info.plist
      properties:
        # Finder がローカライズ名を出す条件: ファイル名と未ローカライズの
        # CFBundleDisplayName が一致すること。英語名は en.lproj 側。
        # ウィジェットギャラリーの見出しは .app 名を使うことがあるので、
        # ファイル名自体は濁点なし日本語のままにする。
        CFBundleName: AI使用量
        CFBundleDisplayName: AI使用量
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # scripts/stamp-git-commit.sh がビルド時に git の短縮ハッシュへ置き換える。
        GitCommitHash: unknown
        LSUIElement: true
        CFBundleIconName: AppIcon
        CFBundleIconFile: AppIcon
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon76x76
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: App/AIUsageWidget.entitlements
      properties:
        # ホストは Cursor の state.vscdb を読む必要がある。
        # temporary-exception だけでは open が authorization denied になる環境があるため、
        # ホストのみサンドボックスなし。ウィジェット拡張はサンドボックスのまま。
        com.apple.security.app-sandbox: false
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.AIUsageWidget
        PRODUCT_NAME: AIUsageWidget
        WRAPPER_NAME: AI使用量.app
        # 実行ファイル名は ASCII のまま。一覧用の .app 名だけ日本語にする。
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        APP_GROUP_ID: $(DEVELOPMENT_TEAM).jp.shigeya.AIUsageWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: NO
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
    preBuildScripts:
      - name: Stamp git commit
        basedOnDependencyAnalysis: false
        script: |
          "${SRCROOT}/scripts/stamp-git-commit.sh"

  AIUsageWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: WidgetExtension
      - path: Shared
    info:
      path: WidgetExtension/Info.plist
      properties:
        CFBundleName: AI使用量
        CFBundleDisplayName: AI使用量
        LSHasLocalizedDisplayName: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
        "CFBundleIcons~ipad":
          CFBundlePrimaryIcon:
            CFBundleIconName: AppIcon
            CFBundleIconFiles:
              - AppIcon60x60
              - AppIcon76x76
        AppGroupID: $(APP_GROUP_ID)
    entitlements:
      path: WidgetExtension/AIUsageWidgetExtension.entitlements
      properties:
        # 拡張は通信しない。network.client を付けると、その不変条件をサンドボックスが守れなくなる。
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.AIUsageWidget.Widget
        MARKETING_VERSION: "1.1.0"
        CURRENT_PROJECT_VERSION: "4"
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        APP_GROUP_ID: $(DEVELOPMENT_TEAM).jp.shigeya.AIUsageWidget
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: NO
        SKIP_INSTALL: false
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"

  # ホストアプリを立てない単体テスト。常駐アプリが起動して初回取得が走らないように Shared を直接取り込む。
  AIUsageWidgetTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Shared
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.shigeya.AIUsageWidget.Tests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        OTHER_LDFLAGS: "$(inherited) -lsqlite3"
